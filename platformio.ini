[env:esp32-s3-devkitc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; ESP32-S3FH4R2: 2 MB PSRAM are QSPI. The devkitc-1 profile declares no memory_type
; and only lands on qio_qspi through its default, so pin it down explicitly.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qspi
board_build.filesystem = littlefs

monitor_speed = 115200
upload_protocol = esptool

; The FH4R2 talks over its USB-Serial-JTAG peripheral, where esptool's default
; hard_reset leaves the chip sitting in download mode instead of starting the
; application. The watchdog reset clears that state.
board_upload.after_reset = watchdog_reset
build_unflags = 
    -std=gnu++11
; RGB_LED_PIN: the WS2812 sits on GPIO21, 47 or 48 depending on the board vendor
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -Wall
    -DBOARD_HAS_PSRAM
    -DRGB_LED_PIN=21
board_build.partitions = huge_app.csv
lib_deps =
    lovyan03/LovyanGFX
    tzapu/WiFiManager
    mathieucarbou/ESP Async WebServer
    mathieucarbou/AsyncTCP
    bblanchon/ArduinoJson
    madhephaestus/ESP32Encoder
    adafruit/Adafruit NeoPixel